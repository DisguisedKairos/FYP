# Use with compose.yaml; the pinned Compose version in cloud/aws/bootstrap.sh.tftpl
# supports !reset. No application or service port is published directly.
services:
  banking:
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      SEED_DEMO: "false"
    stop_grace_period: 30s

  gateway:
    ports: !reset []

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      GREENLINK_DOMAIN: ${GREENLINK_DOMAIN:?Set the public domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      gateway: {condition: service_healthy}

volumes:
  caddy-data:
  caddy-config:
