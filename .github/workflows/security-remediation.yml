name: Security Remediation Agent
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Test agent logic
        run: node --test tests/security-remediation.test.js
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Install Semgrep
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install semgrep
          echo '/tmp/semgrep-venv/bin' >> "$GITHUB_PATH"
      - name: Run real security scans and generate report
        id: scan
        # The runner uses exit 1 for findings, 2 for incomplete scans.
        continue-on-error: true
        run: node scripts/run-security-agent.js
      - name: Upload sanitised report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-report
          path: reports/security-remediation.json
          if-no-files-found: warn
      - name: Enforce scan outcome
        if: steps.scan.outcome == 'failure'
        run: |
          echo 'Security scan found issues or was incomplete. Inspect the report artifact.'
          exit 1
