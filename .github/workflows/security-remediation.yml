
name: Security Remediation Agent

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test agent logic
        run: node --test tests/security-remediation.test.js

      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install Semgrep
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install semgrep
          echo '/tmp/semgrep-venv/bin' >> "$GITHUB_PATH"

      - name: Run security scans and generate report
        id: scan
        continue-on-error: true
        run: node scripts/run-security-agent.js

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-report
          path: reports/security-remediation.json
          if-no-files-found: warn

      - name: Check scan completion
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const file = 'reports/security-remediation.json';

          if (!fs.existsSync(file)) {
            console.error('Security report is missing.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(file, 'utf8'));

          console.log('Security status:', report.status);
          console.log('Total findings:', report.totalFindings);
          console.log('Scanner results:', report.scanStatus);

          const scanners = ['npmAudit', 'gitleaks', 'semgrep'];

          const allPassed = scanners.every(
            name => report.scanStatus?.[name] === 'passed'
          );

          const testsPassed = report.verification?.tests === 'passed';

          if (!allPassed || !testsPassed ||
              report.status === 'INCOMPLETE_SCAN') {
            console.error('Security scanning or verification failed.');
            process.exit(1);
          }

          if (report.totalFindings > 0) {
            console.warn(
              'Security findings require review. See the report artifact.'
            );
          }

          console.log('Security scanning completed successfully.');
          NODE
