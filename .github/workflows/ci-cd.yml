name: Greenlink CI and container delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish verified banking and fraud images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: greenlink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Banking, security, browser and fraud tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-disposable-postgres@127.0.0.1:5432/postgres
      PYTHON: python
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests_python/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r tests_python/requirements.txt
      - name: JavaScript and Python source checks
        run: |
          npm run check
          python -m compileall -q main.py fraud_service deploy tests_python
      - name: PostgreSQL functional and security tests (database required)
        run: |
          node -e "if(!process.env.TEST_DATABASE_URL)process.exit(1)"
          npm test
      - run: npm run test:python
      - run: npm run test:browser
      - name: Real Express, PostgreSQL and FastAPI integration
        run: node scripts/platform-smoke.js
      - name: Verify clean distributable source
        run: |
          npm run package
          npm run package:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: greenlink-source-${{ github.sha }}
          path: |
            releases/*.zip
            releases/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Build and exercise the Compose application
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GREENLINK_BANKING_IMAGE: greenlink-banking:ci
      GREENLINK_FRAUD_IMAGE: greenlink-fraud:ci
      COMPOSE_PROJECT_NAME: greenlink-ci
      GREENLINK_SEED_DEMO: 'true'
      GREENLINK_WEB_PORT: '8088'
      GREENLINK_PUBLIC_ORIGIN: http://127.0.0.1:8088
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: banking
          load: true
          tags: greenlink-banking:ci
          cache-from: type=gha,scope=banking
          cache-to: type=gha,mode=max,scope=banking
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: fraud
          load: true
          tags: greenlink-fraud:ci
          cache-from: type=gha,scope=fraud
          cache-to: type=gha,mode=max,scope=fraud
      - name: Prepare private fixture secrets and validate Compose
        run: |
          node deploy/configuration.js
          docker compose config --quiet
      - name: Start the isolated Compose fixture
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Exercise banking through Nginx and the Python container
        run: |
          node deploy/smoke.js
          docker compose exec -T banking node deploy/banking.js database/check.js
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
      - name: Remove disposable CI containers and volume
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish verified ${{ matrix.target }} image
    needs: [verify, containers]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [banking, fraud]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve repository-owned image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${TARGET}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
