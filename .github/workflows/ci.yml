name: Greenlink checks, application package and container delivery

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API, financial controls, scoring and service tests
        run: npm test
      - name: Browser workflows on desktop and mobile
        run: npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore

  containers:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run setup
      - name: Build and start isolated services
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Gateway and end-to-end service smoke
        run: node tests/platform-smoke.js
        env:
          PLATFORM_SMOKE_BASE_URL: http://127.0.0.1:3000
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Release test resources
        if: always()
        run: docker compose down --volumes

  package:
    needs: [test, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable application package
        run: npm run package
      - name: Verify release archive and manifest
        run: npm run package:verify -- releases/greenlink-digital-bank-1.1.0.zip
      - name: Package archive
        uses: actions/upload-artifact@v4
        with:
          name: greenlink-digital-bank-1.1.0
          path: releases/
          if-no-files-found: error

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - name: Format infrastructure source
        run: terraform fmt -check -recursive cloud/aws
      - name: Validate deployment template without provisioning
        run: |
          terraform -chdir=cloud/aws init -backend=false -input=false
          terraform -chdir=cloud/aws validate
      - name: Validate TLS Compose overlay
        env:
          SERVICE_TOKEN: ci-template-validation-token-never-used
          GREENLINK_DOMAIN: bank.example.com
          PUBLIC_ORIGIN: https://bank.example.com
        run: docker compose -f compose.yaml -f compose.cloud.yaml config --quiet

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, containers, package, infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Container image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
