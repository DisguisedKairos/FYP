name: greenlink

x-service: &service
  image: greenlink-digital-bank:local
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]

x-environment: &environment
  HOST: 0.0.0.0
  DATA_DIR: /app/data
  SERVICE_TOKEN: ${SERVICE_TOKEN:?Run npm run setup before docker compose up}

services:
  fraud:
    <<: *service
    command: [node, services/fraud/server.js]
    environment:
      <<: *environment
      PORT: 4011
    volumes: [fraud-data:/app/data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4011/internal/health',{headers:{Authorization:'Bearer '+process.env.SERVICE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    <<: *service
    command: [node, services/notifications/server.js]
    environment:
      <<: *environment
      PORT: 4012
    volumes: [notification-data:/app/data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4012/internal/health',{headers:{Authorization:'Bearer '+process.env.SERVICE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  banking:
    <<: *service
    command: [node, app.js]
    environment:
      <<: *environment
      PORT: 4010
      FRAUD_SERVICE_URL: http://fraud:4011
      NOTIFICATION_SERVICE_URL: http://notifications:4012
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes: [banking-data:/app/data]
    depends_on:
      fraud: {condition: service_healthy}
      notifications: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *service
    command: [node, services/worker.js]
    environment:
      <<: *environment
      PORT: 4013
      BANKING_SERVICE_URL: http://banking:4010
      JOB_INTERVAL_MS: 2000
    depends_on:
      banking: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4013/internal/status',{headers:{Authorization:'Bearer '+process.env.SERVICE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    <<: *service
    command: [node, services/gateway.js]
    environment:
      <<: *environment
      PORT: 3000
      BANKING_SERVICE_URL: http://banking:4010
      FRAUD_SERVICE_URL: http://fraud:4011
      NOTIFICATION_SERVICE_URL: http://notifications:4012
    networks: [edge, backend]
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    depends_on:
      banking: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  banking-data:
  fraud-data:
  notification-data:

networks:
  edge:
  backend:
    internal: true
